[project]
name = "bazaar-contrib-server"
version = "0.3.0"
description = "Server plugin for Bazaar Compute Node"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core>=0.3.0,<0.4.0",
    "bazaar-contrib-storage>=0.3.0,<0.4.0",
    "bazaar-contrib-schema>=0.3.0,<0.4.0",
    "pydantic>=2.12.0",
]

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-server"

[project.entry-points."bazaar_compute_node.contribs"]
server-migrations = "bazaar_contrib_server:migrations"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "bazaar-contrib-node-migrations>=0.3.0,<0.4.0",
    "bazaar-contrib-sqlite>=0.3.0,<0.4.0",
    "blockbuster>=1.5.29,<1.6",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC", "I"]
