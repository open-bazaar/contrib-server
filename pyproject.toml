[project]
name = "bazaar-contrib-server"
version = "0.3.0rc1"
description = "The Bazaar Compute server: the shell modules put their pages in, and its themes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-http~=0.3.0rc1",
    "bazaar-contrib-schema~=0.3.0rc1",
    "bazaar-contrib-storage~=0.3.0rc1",
    "bazaar-contrib-server-database~=0.3.0rc1",
    "bazaar-contrib-server-migrations~=0.3.0rc2",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "markupsafe>=3.0.0",
    "pydantic>=2.12.0",
    "pygments>=2.20.0",
    "python-multipart>=0.0.32",
    "starlette>=0.48.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.entry-points."bazaar_compute_node.contribs"]
server = "bazaar_contrib_server:server"
server-theme-night = "bazaar_contrib_server:night"
server-theme-day = "bazaar_contrib_server:day"

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-server"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[dependency-groups]
dev = [
    "bazaar-contrib-sqlite~=0.3.0rc1",
    "bazaar-contrib-timer-wheel~=0.3.0rc1",
    "blockbuster>=1.5.29,<1.6",
    "httpx>=0.28.0,<1",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "websockets>=15.0",
]
